[package]
name = "jolt-ecdsa"
version = "0.1.0"
edition = "2021"

[dependencies]
ere-platform-jolt = { git = "https://github.com/Client-Side-Proving/ere", rev = "c9527535fb7976aee30727c3d3bd87a792c423d1", default-features = false }
jolt-inlines-secp256k1 = { git = "https://github.com/a16z/jolt", rev = "2a85f76476daee22dea4234a5fa10c4c89e732be" }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[features]
guest = []

