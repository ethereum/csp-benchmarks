[package]
name = "jolt"
version = "0.1.0"
edition = "2024"

[dependencies]
ere-jolt = { git = "https://github.com/Client-Side-Proving/ere", rev = "c9527535fb7976aee30727c3d3bd87a792c423d1" }
jolt-inlines-blake3 = { git = "https://github.com/a16z/jolt", rev = "2a85f76476daee22dea4234a5fa10c4c89e732be", features = ["host"] }
postcard = { version = "1.0", features = ["alloc"] }

# Workspace
criterion = { workspace = true }
clap = { workspace = true }
ere-zkvm-interface = { workspace = true }
serde = { workspace = true }
utils = { workspace = true }

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "blake3"
harness = false

[[bench]]
name = "keccak"
harness = false

[[bench]]
name = "ecdsa"
harness = false

[[bin]]
name = "sha256_mem_jolt"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "blake3_mem_jolt"
path = "src/bin/blake3_mem.rs"

[[bin]]
name = "keccak_mem_jolt"
path = "src/bin/keccak_mem.rs"

[[bin]]
name = "ecdsa_mem_jolt"
path = "src/bin/ecdsa_mem.rs"
