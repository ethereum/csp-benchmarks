[workspace]
resolver = "3"
members = [
    "binius64",
    "flock",
    "plonky2",
    "provekit",
    "circom",
    "halo2",
    "jolt",
    "risc0",
    "spartan-whir",
    "stark-v",
    "vega",
    "utils",
]
exclude = [
    # Expander does not meet our soundness requirements: upstream Orion accepts
    # incomplete openings and samples queries before binding response rows.
    # M31Ext3 also has fewer than 96 bits before soundness losses.
    "polyhedra-expander",
    # Miden's BLAKE3 dependency conflicts with ProveKit's exact version.
    "miden",
    # Groth16's Noir beta.19 pins keccak 0.2.0-rc.2; WHIR v1's beta.26
    # requires keccak 0.2 stable. Cargo cannot resolve both in one workspace.
    "provekit-groth16",
    "cairo-m",
    "rookie-numbers",
]

[workspace.dependencies]
anyhow = "1.0"
bincode = "1.3"
blake3 = { version = "1.8", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
criterion = "0.5"
ere-zkvm-interface = { git = "https://github.com/Client-Side-Proving/ere", rev = "c9527535fb7976aee30727c3d3bd87a792c423d1" }
env_logger = "0.10"
hex = "0.4"
itertools = "0.13"
log = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
sha2 = "0.10"
sha3 = "0.10"
tracing = "0.1"
k256 = "0.13"

# Local
utils = { path = "utils" }

[patch.crates-io]
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }

# Stark-V's SDK uses the shared interface from the CSP ERE fork.
[patch."https://github.com/eth-act/ere"]
ere-zkvm-interface = { git = "https://github.com/Client-Side-Proving/ere", rev = "c9527535fb7976aee30727c3d3bd87a792c423d1" }
