[workspace]
resolver = "3"
members = [
    "plonky2",
    "provekit",
    "polyhedra-expander",
    "circom",
    "halo2",
    "jolt",
    "miden",
    "risc0",
    "vega",
    "flock",
    "utils",
]
exclude = [
    # Binius64 uses its own Rust toolchain.
    "binius64",
    # Groth16's Noir beta.19 pins keccak 0.2.0-rc.2; WHIR v1's beta.26
    # requires keccak 0.2 stable. Cargo cannot resolve both in one workspace.
    "provekit-groth16",
    "cairo-m",
    "rookie-numbers",
    "stark-v",
]

[workspace.dependencies]
anyhow = "1.0"
bincode = "1.3"
blake3 = { version = "1.8", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
criterion = "0.5"
ere-zkvm-interface = { git = "https://github.com/eth-act/ere", rev = "6573843" }
env_logger = "0.10"
hex = "0.4"
itertools = "0.13"
log = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
sha2 = "0.10"
sha3 = "0.10"
tracing = "0.1"
k256 = "0.13"

# Local
utils = { path = "utils" }

[patch.crates-io]
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
allocative = { git = "https://github.com/facebookexperimental/allocative", rev = "85b773d85d526d068ce94724ff7a7b81203fc95e" }
