[package]
name = "plonky2_gpu_circuits"
version = "0.1.0"
edition = "2024"

[dependencies]
plonky2 = { git = "https://github.com/robknight/plonky2", rev = "52ab658ec2f5f0eeb6e7a3e0511b6525813534ac", features = ["gpu"] }
plonky2_u32 = { git = "https://github.com/robknight/plonky2-u32", rev = "fa7200f1d527c677f2a0f2b727daee142dcdf1f3" }
utils = { path = "../utils" }
anyhow = "1.0"
itertools = "0.13"
log = "0.4"
sha2 = "0.10"
env_logger = "0.10"
rand = "0.8"
criterion = "0.5"
clap = { version = "4.5", features = ["derive"] }
num = "0.4"

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "keccak"
harness = false

[[bench]]
name = "poseidon"
harness = false

[[bin]]
name = "sha256_mem_plonky2_gpu"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "keccak_mem_plonky2_gpu"
path = "src/bin/keccak_mem.rs"

[[bin]]
name = "poseidon_mem_plonky2_gpu"
path = "src/bin/poseidon_mem.rs"
