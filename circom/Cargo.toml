[package]
name = "circom"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
# Enable after a maintainer publishes the zkey generated from ecdsa_p256_32.
circom-ecdsa-p256-bench = []

[dependencies]
circom-prover = { version = "0.1", default-features = false, features = ["witnesscalc", "rapidsnark"] }
witnesscalc-adapter = "0.1"

anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
utils = { workspace = true }
ark-bn254 = "0.5"
k256 = { workspace = true }
p256 = "0.13"
num-bigint = "0.4"

[dev-dependencies]
criterion = { workspace = true }

[build-dependencies]
circom-prover = { version = "0.1", default-features = false, features = ["witnesscalc", "rapidsnark"] }
witnesscalc-adapter = "0.1"

[[bench]]
name = "sha256_bench"
harness = false

[[bench]]
name = "ecdsa_bench"
harness = false

[[bench]]
name = "ecdsa_p256_bench"
harness = false
required-features = ["circom-ecdsa-p256-bench"]

[[bench]]
name = "poseidon_bench"
harness = false

[[bench]]
name = "keccak_bench"
harness = false

[[bin]]
name = "sha256_mem_circom"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "ecdsa_mem_circom"
path = "src/bin/ecdsa_mem.rs"

[[bin]]
name = "ecdsa_p256_mem_circom"
path = "src/bin/ecdsa_p256_mem.rs"
required-features = ["circom-ecdsa-p256-bench"]

[[bin]]
name = "keccak_mem_circom"
path = "src/bin/keccak_mem.rs"

[[bin]]
name = "poseidon_mem_circom"
path = "src/bin/poseidon_mem.rs"
