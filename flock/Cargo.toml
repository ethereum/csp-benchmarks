[package]
name = "flock"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
criterion = "0.5"
flock-prover = { git = "https://github.com/succinctlabs/flock", rev = "b684b1258e4b1f202bec24afd660ace851b09e5e" }
flock-hash = { git = "https://github.com/succinctlabs/flock", rev = "b684b1258e4b1f202bec24afd660ace851b09e5e" }
serde = { version = "1.0", features = ["derive"] }
utils = { path = "../utils" }

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "blake3"
harness = false

[[bin]]
name = "sha256_mem_flock"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "blake3_mem_flock"
path = "src/bin/blake3_mem.rs"
