[package]
name = "flock"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
criterion = "0.5"
# TODO: Return to succinctlabs/flock as soon as the upstream BLAKE3 dependency/feature conflict with ProveKit is resolved.
flock-prover = { git = "https://github.com/Client-Side-Proving/flock", rev = "fd83f87b2a02878352ffa19023c36c108cbb97f2" }
flock-hash = { git = "https://github.com/Client-Side-Proving/flock", rev = "fd83f87b2a02878352ffa19023c36c108cbb97f2" }
serde = { version = "1.0", features = ["derive"] }
utils = { path = "../utils" }

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "blake3"
harness = false

[[bin]]
name = "sha256_mem_flock"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "blake3_mem_flock"
path = "src/bin/blake3_mem.rs"
