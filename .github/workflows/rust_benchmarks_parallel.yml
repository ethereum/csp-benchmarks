name: Rust Benchmarks (parallel)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run benches for all benchmark crates"
        required: false
        default: false
        type: boolean
      include_optional:
        description: "Run benchmarks of excluded systems"
        required: false
        default: false
        type: boolean
      benchmark_crate:
        description: "Run only this benchmark crate (e.g. risc0)"
        required: false
        default: ""
        type: string
      benchmark_target:
        description: "Run only this bench target inside benchmark_crate (e.g. sha256)"
        required: false
        default: ""
        type: string
      prod_run:
        description: "Run on self-hosted runner"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}

jobs:
  detect-crates:
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.prod_run == true) && 'self-hosted' || 'macos-latest' }}
    outputs:
      crates: ${{ steps.set.outputs.crates }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base‑remote and fetch it
        id: base
        run: |
          REMOTE=origin
          if [[ "${GITHUB_REPOSITORY}" != "privacy-ethereum/csp-benchmarks" ]]; then
            git remote add upstream https://github.com/privacy-ethereum/csp-benchmarks.git
            REMOTE=upstream
          fi

          BASE_BRANCH="main"
          git fetch --prune --no-tags --depth=1 "$REMOTE" "$BASE_BRANCH"

          # expose for later steps
          echo "BASE_REF=${REMOTE}/${BASE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Detect changed benchmark crates
        id: set
        run: |
          BASE_REF="${{ steps.base.outputs.BASE_REF }}"

          RUN_ALL="${{ github.event.inputs.run_all }}"
          INCLUDE_OPTIONAL="${{ github.event.inputs.include_optional }}"
          BENCHMARK_CRATE='${{ github.event.inputs.benchmark_crate }}'
          BENCHMARK_TARGET='${{ github.event.inputs.benchmark_target }}'

          if [[ -n "$BENCHMARK_TARGET" && -z "$BENCHMARK_CRATE" ]]; then
            echo "benchmark_target requires benchmark_crate" >&2
            exit 1
          fi

          if [[ -n "$BENCHMARK_CRATE" ]]; then
            json=$(jq -cn --arg crate "$BENCHMARK_CRATE" '[$crate]')
            echo "benchmark_crate override active: ignoring run_all, include_optional, and diff detection"
            echo "Selected crate override: '$json'"
            echo "crates=$json" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ─── Run all benches when we're merging a PR ─────────────────────
          EVENT_NAME='${{ github.event_name }}'
          if [[ "$EVENT_NAME" == "push" ]]; then
            RUN_ALL="true"
          fi

          EXCLUDE_REGEX='^(utils|mobile|zkvm)(/|$)'

          # ─── 1. discover Cargo.toml files ────────────────────────────────
          dirs=$(find . -mindepth 2 -maxdepth 4 -type f -name Cargo.toml \
                  ! -path "./Cargo.toml" \
                | sed -e 's|^\./||' -e 's|/Cargo.toml$||' \
                | grep -vE "$EXCLUDE_REGEX" \
                | sort -u)

          # ─── 2. select top‑level dirs ───────────────────────────────────
          selected=()      # declare early to please `set -u`
          while IFS= read -r d; do
            skip=false
            for p in "${selected[@]-}"; do
              [[ "$d/" == "$p/"* ]] && skip=true && break
            done
            $skip || selected+=("$d")
          done < <(printf '%s\n' "$dirs" | awk '{print length,$0}' | sort -n | cut -d' ' -f2-)

          # ─── 3. filter by diff & [[bench]] ──────────────────────────────
          changed=()       # declare early
          for d in "${selected[@]}"; do
            # When RUN_ALL=true we ignore the diff check, otherwise we require a diff.
            if [[ "$RUN_ALL" != "true" ]]; then
              git diff --name-only "$BASE_REF"..HEAD 2>/dev/null | grep -q "^${d}/" || continue
            fi

            # Always require the crate to have a [[bench]] section.
            if grep -q '^\[\[bench\]\]' "$d/Cargo.toml"; then
              changed+=("$d")
            fi
          done

          # ─── 3.5 exclude optional crates unless explicitly included ────
          if [[ "$INCLUDE_OPTIONAL" != "true" ]]; then
            filtered=()
            for d in "${changed[@]}"; do
              if [[ ! "$d" =~ ^(openvm|sp1|nexus)(/|$) ]]; then
                filtered+=("$d")
              fi
            done
            changed=("${filtered[@]}")
          fi

          # ─── 4. output JSON array ───────────────────────────────────────
          json=$(printf '%s\n' "${changed[@]}" |
            jq -R -s -c 'split("\n") | map(select(length>0))')

          echo "Detected changed crates: '$json'"
          echo "crates=$json" >> "$GITHUB_OUTPUT"

  prepare-cache:
    needs: detect-crates
    if: ${{ needs.detect-crates.outputs.crates != '' && needs.detect-crates.outputs.crates != '[]' }}
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.prod_run == true) && 'self-hosted' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache everything
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup
            target
            binius64/target
            nexus/target
            cairo-m/target
            rookie-numbers/target
            stark-v/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-03-04
          override: true
          profile: default
          default: true
          components: llvm-tools, rustc-dev, rustfmt, clippy

      - name: Install Binius toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.97.1
          profile: minimal
          components: rustfmt, clippy

      - name: Install excluded crates toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-04-06
          profile: minimal
          components: llvm-tools, rustc-dev, rust-src, rustfmt, clippy

      - name: Install Rookie Numbers toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-07-14
          profile: minimal

      - name: Install OpenVM
        if: ${{ github.event.inputs.include_optional == true }}
        uses: ./.github/actions/install-openvm
      - name: Install OpenMPI for polyhedra-expander
        uses: ./.github/actions/install-ompi

      - name: Install RISC0 toolchain
        uses: ./.github/actions/install-risc0

      - name: Install SP1 toolchain
        if: ${{ github.event.inputs.include_optional == true }}
        uses: ./.github/actions/install-sp1

      - name: Install LLVM and LLD for cairo-m
        uses: ./.github/actions/install-llvm

      - name: Install circom
        id: circom_setup
        uses: ./.github/actions/install-circom

      - name: Cache the ECDSA witness generator
        id: ecdsa_witness_cache
        uses: actions/cache@v4
        with:
          # Only the generated files: the same directories also hold the
          # downloaded .zkey, which must not be cached or restored over.
          path: |
            circom/circuits/ecdsa/ecdsa_32/ecdsa_32.cpp
            circom/circuits/ecdsa/ecdsa_32/ecdsa_32.dat
            circom/circuits/ecdsa/ecdsa_p256_32/ecdsa_p256_32.cpp
            circom/circuits/ecdsa/ecdsa_p256_32/ecdsa_p256_32.dat
          key: ${{ runner.os }}-${{ runner.arch }}-ecdsa-witness-circom-${{ steps.circom_setup.outputs.version }}-${{ hashFiles('circom/build.rs', 'circom/circuits/ecdsa/**/*.circom', 'circom/circomlib/circuits/**/*.circom') }}

      # Preserve the restored mtimes used by the native build cache. The exact
      # key above establishes that both files match every generator input.
      - name: Use cached ECDSA witness generator
        if: ${{ steps.ecdsa_witness_cache.outputs.cache-hit == 'true' }}
        run: |
          if test -s circom/circuits/ecdsa/ecdsa_32/ecdsa_32.cpp && test -s circom/circuits/ecdsa/ecdsa_32/ecdsa_32.dat; then
            echo "CIRCOM_ECDSA_WITNESS_CACHE_HIT=1" >> "$GITHUB_ENV"
          fi

      - name: Build full workspace (release)
        run: |
          INCLUDE_OPTIONAL='${{ github.event.inputs.include_optional }}'
          if [[ "$INCLUDE_OPTIONAL" == "true" ]]; then
            cargo build --release --workspace
          else
            cargo build --release --workspace --exclude openvm --exclude sp1
          fi

      - name: Build non-workspace crates separately
        run: |
          CRATES='${{ needs.detect-crates.outputs.crates }}'
          if echo "$CRATES" | grep -q '"binius64"'; then
            cd binius64 && RUSTFLAGS="-C target-cpu=native" cargo build --release && cd ..
          fi
          if echo "$CRATES" | grep -q '"nexus"'; then
            cd nexus && cargo build --release && cd ..
          fi
          if echo "$CRATES" | grep -q '"cairo-m"'; then
            cd cairo-m && cargo build --release && cd ..
          fi
          if echo "$CRATES" | grep -q '"rookie-numbers"'; then
            cd rookie-numbers && cargo build --release && cd ..
          fi
          if echo "$CRATES" | grep -q '"stark-v"'; then
            cd stark-v && cargo build --release && cd ..
          fi

  bench:
    if: ${{ needs.detect-crates.outputs.crates != '' && needs.detect-crates.outputs.crates != '[]' }}
    needs: [prepare-cache, detect-crates]
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.prod_run == true) && 'self-hosted' || 'macos-latest' }}
    timeout-minutes: 720
    strategy:
      fail-fast: false
      # When dispatched with prod_run=true (self-hosted), run matrix sequentially
      max-parallel: ${{ (github.event_name == 'workflow_dispatch' && inputs.prod_run == true) && 1 || 99 }}
      matrix:
        crate: ${{ fromJson(needs.detect-crates.outputs.crates) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify circom zkeys
        if: ${{ contains(matrix.crate, 'circom') }}
        env:
          ZKEYS_RELEASE_URL: https://github.com/privacy-ethereum/csp-benchmarks/releases/download/zkeys-v2
        run: |
          set -euo pipefail
          while IFS= read -r zkey; do
            [[ -n "$zkey" ]] || continue
            mkdir -p "circom/$(dirname "$zkey")"
            curl --fail --location --retry 3 --retry-all-errors \
              "$ZKEYS_RELEASE_URL/$(basename "$zkey")" \
              --output "circom/$zkey"
          done <<'EOF'
          circuits/ecdsa/ecdsa_32/ecdsa_32_0001.zkey
          circuits/keccak/keccak_1024/keccak_1024_0001.zkey
          circuits/keccak/keccak_128/keccak_128_0001.zkey
          circuits/keccak/keccak_2048/keccak_2048_0001.zkey
          circuits/keccak/keccak_256/keccak_256_0001.zkey
          circuits/keccak/keccak_512/keccak_512_0001.zkey
          circuits/poseidon/poseidon_12/poseidon_12_0001.zkey
          circuits/poseidon/poseidon_16/poseidon_16_0001.zkey
          circuits/poseidon/poseidon_2/poseidon_2_0001.zkey
          circuits/poseidon/poseidon_4/poseidon_4_0001.zkey
          circuits/poseidon/poseidon_8/poseidon_8_0001.zkey
          circuits/sha256/sha256_1024/sha256_1024_0001.zkey
          circuits/sha256/sha256_128/sha256_128_0001.zkey
          circuits/sha256/sha256_2048/sha256_2048_0001.zkey
          circuits/sha256/sha256_256/sha256_256_0001.zkey
          circuits/sha256/sha256_512/sha256_512_0001.zkey
          EOF

          (cd circom && shasum -a 256 --check checksums.sha256)

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            binius64/target
            nexus/target
            cairo-m/target
            rookie-numbers/target
            stark-v/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-03-04
          override: true
          profile: default
          default: true
          components: llvm-tools, rustc-dev

      - name: Install Binius toolchain
        if: ${{ contains(matrix.crate, 'binius64') }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.97.1
          profile: minimal

      - name: Install excluded crates toolchain
        if: ${{ contains(matrix.crate, 'nexus') || contains(matrix.crate, 'cairo-m') }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-04-06
          profile: minimal
          components: llvm-tools, rustc-dev, rust-src, rustfmt, clippy

      - name: Install Rookie Numbers toolchain
        if: ${{ contains(matrix.crate, 'rookie-numbers') }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-07-14
          override: true
          profile: minimal

      - name: Install OpenVM
        if: ${{ contains(matrix.crate, 'openvm') }}
        uses: ./.github/actions/install-openvm

      - name: Install Nargo
        if: ${{ contains(matrix.crate, 'provekit') }}
        uses: ./.github/actions/install-nargo
        with:
          version: "1.0.0-beta.19"

      - name: Install OpenMPI for polyhedra-expander
        if: ${{ contains(matrix.crate, 'polyhedra-expander') }}
        uses: ./.github/actions/install-ompi

      - name: Install RISC0 toolchain
        if: ${{ contains(matrix.crate, 'risc0') }}
        uses: ./.github/actions/install-risc0

      - name: Install SP1 toolchain
        if: ${{ contains(matrix.crate, 'sp1') }}
        uses: ./.github/actions/install-sp1

      - name: Install Jolt toolchain
        if: ${{ contains(matrix.crate, 'jolt') }}
        uses: ./.github/actions/install-jolt

      - name: Install LLVM and LLD for cairo-m
        if: ${{ contains(matrix.crate, 'cairo-m') }}
        uses: ./.github/actions/install-llvm

      - name: Install RISC-V target for stark-v
        if: ${{ contains(matrix.crate, 'stark-v') }}
        run: |
          rustup target add riscv32im-unknown-none-elf

      - name: Install circom
        if: ${{ contains(matrix.crate, 'circom') }}
        id: circom_setup
        uses: ./.github/actions/install-circom

      - name: Cache the ECDSA witness generator
        if: ${{ contains(matrix.crate, 'circom') }}
        id: ecdsa_witness_cache
        uses: actions/cache@v4
        with:
          # Only the generated files: the same directories also hold the
          # downloaded .zkey, which must not be cached or restored over.
          path: |
            circom/circuits/ecdsa/ecdsa_32/ecdsa_32.cpp
            circom/circuits/ecdsa/ecdsa_32/ecdsa_32.dat
            circom/circuits/ecdsa/ecdsa_p256_32/ecdsa_p256_32.cpp
            circom/circuits/ecdsa/ecdsa_p256_32/ecdsa_p256_32.dat
          key: ${{ runner.os }}-${{ runner.arch }}-ecdsa-witness-circom-${{ steps.circom_setup.outputs.version }}-${{ hashFiles('circom/build.rs', 'circom/circuits/ecdsa/**/*.circom', 'circom/circomlib/circuits/**/*.circom') }}

      # Preserve the restored mtimes used by the native build cache. The exact
      # key above establishes that both files match every generator input.
      - name: Use cached ECDSA witness generator
        if: ${{ contains(matrix.crate, 'circom') && steps.ecdsa_witness_cache.outputs.cache-hit == 'true' }}
        run: |
          if test -s circom/circuits/ecdsa/ecdsa_32/ecdsa_32.cpp && test -s circom/circuits/ecdsa/ecdsa_32/ecdsa_32.dat; then
            echo "CIRCOM_ECDSA_WITNESS_CACHE_HIT=1" >> "$GITHUB_ENV"
          fi

      - name: Build and copy excluded memory benchmark binary to workspace target
        if: ${{ contains(matrix.crate, 'binius64') || contains(matrix.crate, 'nexus') || contains(matrix.crate, 'cairo-m') || contains(matrix.crate, 'rookie-numbers') || contains(matrix.crate, 'stark-v') }}
        run: |
          mkdir -p target/release
          if [ "${{ matrix.crate }}" = "binius64" ]; then
            cd binius64 && RUSTFLAGS="-C target-cpu=native" cargo build --release --bin sha256_mem_binius64 --bin keccak_mem_binius64 --bin blake3_mem_binius64 && cd ..
            cp binius64/target/release/sha256_mem_binius64 target/release/
            cp binius64/target/release/keccak_mem_binius64 target/release/
            cp binius64/target/release/blake3_mem_binius64 target/release/
          elif [ "${{ matrix.crate }}" = "nexus" ]; then
            cd nexus && cargo build --release --bin sha256_mem_nexus && cd ..
            cp nexus/target/release/sha256_mem_nexus target/release/
          elif [ "${{ matrix.crate }}" = "cairo-m" ]; then
            cd cairo-m && cargo build --release --bin sha256_mem_cairo_m && cd ..
            cp cairo-m/target/release/sha256_mem_cairo_m target/release/
          elif [ "${{ matrix.crate }}" = "rookie-numbers" ]; then
            cd rookie-numbers && cargo build --release --bin sha256_mem_rookie_numbers && cd ..
            cp rookie-numbers/target/release/sha256_mem_rookie_numbers target/release/
          elif [ "${{ matrix.crate }}" = "stark-v" ]; then
            cd stark-v && cargo build --release --bin sha256_mem_stark_v --bin keccak_mem_stark_v --bin blake3_mem_stark_v && cd ..
            cp stark-v/target/release/sha256_mem_stark_v target/release/
            cp stark-v/target/release/keccak_mem_stark_v target/release/
            cp stark-v/target/release/blake3_mem_stark_v target/release/
          fi

      - name: Run benches in ${{ matrix.crate }}
        run: |
          PROFILE="full"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PROFILE="reduced"
          fi
          BENCHMARK_TARGET='${{ github.event.inputs.benchmark_target }}'
          export BENCH_INPUT_PROFILE="$PROFILE"
          if [[ "${{ matrix.crate }}" == "binius64" ]]; then
            export RUSTFLAGS="-C target-cpu=native"
          fi
          echo "Using BENCH_INPUT_PROFILE=$BENCH_INPUT_PROFILE for ${{ matrix.crate }}"
          cd ${{ matrix.crate }}
          if [[ -n "$BENCHMARK_TARGET" ]]; then
            echo "Running targeted bench command: cargo bench --bench $BENCHMARK_TARGET"
            cargo bench --bench "$BENCHMARK_TARGET"
          else
            echo "Running bench command: cargo bench"
            cargo bench
          fi

      - name: Copy excluded crates criterion results to workspace target
        if: ${{ contains(matrix.crate, 'binius64') || contains(matrix.crate, 'nexus') || contains(matrix.crate, 'cairo-m') || contains(matrix.crate, 'rookie-numbers') || contains(matrix.crate, 'stark-v') }}
        run: |
          mkdir -p target/criterion
          cp -r ${{ matrix.crate }}/target/criterion/* target/criterion/

      - name: Upload reports for ${{ matrix.crate }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "criterion-${{ matrix.crate }}"
          path: target/criterion
          if-no-files-found: warn
          retention-days: 30

      - name: Upload metrics for ${{ matrix.crate }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "metrics-${{ matrix.crate }}"
          path: ${{ matrix.crate }}/**/*_metrics.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload mem reports for ${{ matrix.crate }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "mem-${{ matrix.crate }}"
          path: |
            ${{ matrix.crate }}/*_mem_report.json
          if-no-files-found: warn
          retention-days: 30
