name: Rust Benchmarks (parallel)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run benches for all benchmark crates"
        required: false
        default: false
        type: boolean
      benchmark_crate:
        description: "Run only this benchmark crate (e.g. risc0)"
        required: false
        default: ""
        type: string
      benchmark_target:
        description: "Run only this bench target inside benchmark_crate (e.g. sha256)"
        required: false
        default: ""
        type: string
      prod_run:
        description: "Run on self-hosted runner"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}

jobs:
  detect-crates:
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.prod_run == true) && 'self-hosted' || 'macos-latest' }}
    outputs:
      crates: ${{ steps.set.outputs.crates }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base‑remote and fetch it
        id: base
        run: |
          REMOTE=origin
          if [[ "${GITHUB_REPOSITORY}" != "privacy-ethereum/csp-benchmarks" ]]; then
            git remote add upstream https://github.com/privacy-ethereum/csp-benchmarks.git
            REMOTE=upstream
          fi

          BASE_BRANCH="main"
          git fetch --prune --no-tags --depth=1 "$REMOTE" "$BASE_BRANCH"

          # expose for later steps
          echo "BASE_REF=${REMOTE}/${BASE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Detect changed benchmark crates
        id: set
        run: |
          BASE_REF="${{ steps.base.outputs.BASE_REF }}"

          RUN_ALL="${{ github.event.inputs.run_all }}"
          BENCHMARK_CRATE='${{ github.event.inputs.benchmark_crate }}'
          BENCHMARK_TARGET='${{ github.event.inputs.benchmark_target }}'
          EXCLUDE_REGEX='^(utils|mobile|zkvm|polyhedra-expander)(/|$)'

          if [[ -n "$BENCHMARK_TARGET" && -z "$BENCHMARK_CRATE" ]]; then
            echo "benchmark_target requires benchmark_crate" >&2
            exit 1
          fi

          if [[ -n "$BENCHMARK_CRATE" ]]; then
            if [[ "$BENCHMARK_CRATE" =~ $EXCLUDE_REGEX ]]; then
              echo "Benchmark crate is disabled or excluded: $BENCHMARK_CRATE" >&2
              exit 1
            fi
            json=$(jq -cn --arg crate "$BENCHMARK_CRATE" '[$crate]')
            echo "benchmark_crate override active: ignoring run_all and diff detection"
            echo "Selected crate override: '$json'"
            echo "crates=$json" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ─── Run all benches when we're merging a PR ─────────────────────
          EVENT_NAME='${{ github.event_name }}'
          if [[ "$EVENT_NAME" == "push" ]]; then
            RUN_ALL="true"
          fi

          # ─── 1. discover Cargo.toml files ────────────────────────────────
          dirs=$(find . -mindepth 2 -maxdepth 4 -type f -name Cargo.toml \
                  ! -path "./Cargo.toml" \
                | sed -e 's|^\./||' -e 's|/Cargo.toml$||' \
                | grep -vE "$EXCLUDE_REGEX" \
                | sort -u)

          # ─── 2. select top‑level dirs ───────────────────────────────────
          selected=()      # declare early to please `set -u`
          while IFS= read -r d; do
            skip=false
            for p in "${selected[@]-}"; do
              [[ "$d/" == "$p/"* ]] && skip=true && break
            done
            $skip || selected+=("$d")
          done < <(printf '%s\n' "$dirs" | awk '{print length,$0}' | sort -n | cut -d' ' -f2-)

          # ─── 3. filter by diff & [[bench]] ──────────────────────────────
          changed=()       # declare early
          SHARED_CHANGED=false
          if git diff --name-only "$BASE_REF"..HEAD 2>/dev/null | grep -qE '^(Cargo\.(toml|lock)|utils/)'; then
            SHARED_CHANGED=true
          fi
          for d in "${selected[@]}"; do
            # When RUN_ALL=true we ignore the diff check, otherwise we require a diff.
            if [[ "$RUN_ALL" != "true" && "$SHARED_CHANGED" != "true" ]]; then
              git diff --name-only "$BASE_REF"..HEAD 2>/dev/null | grep -q "^${d}/" || continue
            fi

            # Always require the crate to have a [[bench]] section.
            if grep -q '^\[\[bench\]\]' "$d/Cargo.toml"; then
              changed+=("$d")
            fi
          done

          # ─── 4. output JSON array ───────────────────────────────────────
          json=$(printf '%s\n' "${changed[@]}" |
            jq -R -s -c 'split("\n") | map(select(length>0))')

          echo "Detected changed crates: '$json'"
          echo "crates=$json" >> "$GITHUB_OUTPUT"

  prepare-cache:
    needs: detect-crates
    if: ${{ needs.detect-crates.outputs.crates != '' && needs.detect-crates.outputs.crates != '[]' }}
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.prod_run == true) && 'self-hosted' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache everything
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup
            target
            miden/target
            cairo-m/target
            rookie-numbers/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-03-14
          override: true
          profile: default
          default: true
          components: llvm-tools, rustc-dev, rustfmt, clippy

      - name: Install Rust 1.98.1
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.98.1
          profile: minimal
          components: rustfmt, clippy

      - name: Install excluded crates toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-04-06
          profile: minimal
          components: llvm-tools, rustc-dev, rust-src, rustfmt, clippy

      - name: Install Rookie Numbers toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-07-14
          profile: minimal

      - name: Install RISC-V target for Stark-V
        run: rustup target add riscv32im-unknown-none-elf --toolchain nightly-2026-03-14

      - name: Install RISC0 toolchain
        uses: ./.github/actions/install-risc0

      - name: Install LLVM and LLD for cairo-m
        uses: ./.github/actions/install-llvm

      - name: Install circom
        id: circom_setup
        uses: ./.github/actions/install-circom

      - name: Cache the ECDSA witness generator
        id: ecdsa_witness_cache
        uses: actions/cache@v4
        with:
          # Only the generated files: the same directories also hold the
          # downloaded .zkey, which must not be cached or restored over.
          path: |
            circom/circuits/ecdsa/ecdsa_32/ecdsa_32.cpp
            circom/circuits/ecdsa/ecdsa_32/ecdsa_32.dat
            circom/circuits/ecdsa/ecdsa_p256_32/ecdsa_p256_32.cpp
            circom/circuits/ecdsa/ecdsa_p256_32/ecdsa_p256_32.dat
          key: ${{ runner.os }}-${{ runner.arch }}-ecdsa-witness-circom-${{ steps.circom_setup.outputs.version }}-${{ hashFiles('circom/build.rs', 'circom/circuits/ecdsa/**/*.circom', 'circom/circomlib/circuits/**/*.circom') }}

      # Preserve the restored mtimes used by the native build cache. The exact
      # key above establishes that both files match every generator input.
      - name: Use cached ECDSA witness generator
        if: ${{ steps.ecdsa_witness_cache.outputs.cache-hit == 'true' }}
        run: |
          if test -s circom/circuits/ecdsa/ecdsa_32/ecdsa_32.cpp && test -s circom/circuits/ecdsa/ecdsa_32/ecdsa_32.dat; then
            echo "CIRCOM_ECDSA_WITNESS_CACHE_HIT=1" >> "$GITHUB_ENV"
          fi

      - name: Build full workspace (release)
        run: cargo build --release --workspace

      - name: Build non-workspace crates separately
        run: |
          CRATES='${{ needs.detect-crates.outputs.crates }}'
          if echo "$CRATES" | grep -q '"provekit-groth16"'; then
            cd provekit-groth16 && cargo build --release && cd ..
          fi
          if echo "$CRATES" | grep -q '"miden"'; then
            cd miden && cargo build --release && cd ..
          fi
          if echo "$CRATES" | grep -q '"cairo-m"'; then
            cd cairo-m && ../.github/actions/install-llvm/with-llvm.sh cargo build --release && cd ..
          fi
          if echo "$CRATES" | grep -q '"rookie-numbers"'; then
            cd rookie-numbers && cargo build --release && cd ..
          fi

  bench:
    if: ${{ needs.detect-crates.outputs.crates != '' && needs.detect-crates.outputs.crates != '[]' }}
    needs: [prepare-cache, detect-crates]
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.prod_run == true) && 'self-hosted' || 'macos-latest' }}
    timeout-minutes: 720
    strategy:
      fail-fast: false
      # When dispatched with prod_run=true (self-hosted), run matrix sequentially
      max-parallel: ${{ (github.event_name == 'workflow_dispatch' && inputs.prod_run == true) && 1 || 99 }}
      matrix:
        crate: ${{ fromJson(needs.detect-crates.outputs.crates) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify circom zkeys
        if: ${{ contains(matrix.crate, 'circom') }}
        env:
          ZKEYS_RELEASE_URL: https://github.com/ethereum/csp-benchmarks/releases/download/zkeys-v3
        run: |
          set -euo pipefail
          while read -r checksum zkey; do
            [[ -n "$zkey" ]] || continue
            mkdir -p "circom/$(dirname "$zkey")"
            curl --fail --location --retry 3 --retry-all-errors \
              "$ZKEYS_RELEASE_URL/$(basename "$zkey")" \
              --output "circom/$zkey"
          done < circom/checksums.sha256

          (cd circom && shasum -a 256 --check checksums.sha256)

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            miden/target
            cairo-m/target
            rookie-numbers/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-03-14
          override: true
          profile: default
          default: true
          components: llvm-tools, rustc-dev

      - name: Install Rust 1.98.1
        if: ${{ contains(matrix.crate, 'miden') }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.98.1
          profile: minimal

      - name: Install excluded crates toolchain
        if: ${{ contains(matrix.crate, 'cairo-m') }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-04-06
          profile: minimal
          components: llvm-tools, rustc-dev, rust-src, rustfmt, clippy

      - name: Install Rookie Numbers toolchain
        if: ${{ contains(matrix.crate, 'rookie-numbers') }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-07-14
          override: true
          profile: minimal

      - name: Install Nargo
        if: ${{ contains(matrix.crate, 'provekit') }}
        uses: ./.github/actions/install-nargo
        with:
          version: ${{ matrix.crate == 'provekit' && '1.0.0-beta.26' || '1.0.0-beta.19' }}

      - name: Install Nargo for Barretenberg
        if: ${{ matrix.crate == 'barretenberg' }}
        uses: ./.github/actions/install-nargo
        with:
          version: "1.0.0-beta.25"

      - name: Install Barretenberg
        if: ${{ matrix.crate == 'barretenberg' }}
        uses: ./.github/actions/install-bb

      - name: Install RISC0 toolchain
        if: ${{ contains(matrix.crate, 'risc0') }}
        uses: ./.github/actions/install-risc0

      - name: Install Jolt toolchain
        if: ${{ contains(matrix.crate, 'jolt') }}
        uses: ./.github/actions/install-jolt

      - name: Install LLVM and LLD for cairo-m
        if: ${{ contains(matrix.crate, 'cairo-m') }}
        uses: ./.github/actions/install-llvm

      - name: Install RISC-V target for stark-v
        if: ${{ contains(matrix.crate, 'stark-v') }}
        run: |
          rustup target add riscv32im-unknown-none-elf --toolchain nightly-2026-03-14

      - name: Install circom
        if: ${{ contains(matrix.crate, 'circom') }}
        id: circom_setup
        uses: ./.github/actions/install-circom

      - name: Install Spartan-WHIR circuit dependencies
        if: ${{ matrix.crate == 'spartan-whir' }}
        shell: bash
        run: |
          set -euo pipefail
          git --no-pager submodule update --init circom/circomlib
          if [[ "$(uname -s)" == "Darwin" ]]; then
            brew list --versions gmp >/dev/null || brew install gmp
            brew list --versions nlohmann-json >/dev/null || brew install nlohmann-json
            echo "CPLUS_INCLUDE_PATH=$(brew --prefix)/include${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}" >> "$GITHUB_ENV"
            echo "LIBRARY_PATH=$(brew --prefix)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y libgmp-dev nlohmann-json3-dev
          fi

      - name: Cache KoalaBear Circom
        if: ${{ matrix.crate == 'spartan-whir' }}
        uses: actions/cache@v4
        with:
          path: ~/.circom-koalabear
          key: ${{ runner.os }}-${{ runner.arch }}-circom-koalabear-bb7ae6d406debbfe8afc68305cbd6106fda945bc

      - name: Install KoalaBear Circom for Spartan-WHIR
        if: ${{ matrix.crate == 'spartan-whir' }}
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_DIR="$HOME/.circom-koalabear"
          if [[ ! -x "$INSTALL_DIR/bin/circom" ]]; then
            cargo install \
              --git https://github.com/Client-Side-Proving/circom \
              --rev bb7ae6d406debbfe8afc68305cbd6106fda945bc \
              --locked \
              --root "$INSTALL_DIR" \
              circom
          fi
          echo "SPARTAN_WHIR_CIRCOM=$INSTALL_DIR/bin/circom" >> "$GITHUB_ENV"
          "$INSTALL_DIR/bin/circom" --version

      - name: Cache the ECDSA witness generator
        if: ${{ contains(matrix.crate, 'circom') }}
        id: ecdsa_witness_cache
        uses: actions/cache@v4
        with:
          # Only the generated files: the same directories also hold the
          # downloaded .zkey, which must not be cached or restored over.
          path: |
            circom/circuits/ecdsa/ecdsa_32/ecdsa_32.cpp
            circom/circuits/ecdsa/ecdsa_32/ecdsa_32.dat
            circom/circuits/ecdsa/ecdsa_p256_32/ecdsa_p256_32.cpp
            circom/circuits/ecdsa/ecdsa_p256_32/ecdsa_p256_32.dat
          key: ${{ runner.os }}-${{ runner.arch }}-ecdsa-witness-circom-${{ steps.circom_setup.outputs.version }}-${{ hashFiles('circom/build.rs', 'circom/circuits/ecdsa/**/*.circom', 'circom/circomlib/circuits/**/*.circom') }}

      # Preserve the restored mtimes used by the native build cache. The exact
      # key above establishes that both files match every generator input.
      - name: Use cached ECDSA witness generator
        if: ${{ contains(matrix.crate, 'circom') && steps.ecdsa_witness_cache.outputs.cache-hit == 'true' }}
        run: |
          if test -s circom/circuits/ecdsa/ecdsa_32/ecdsa_32.cpp && test -s circom/circuits/ecdsa/ecdsa_32/ecdsa_32.dat; then
            echo "CIRCOM_ECDSA_WITNESS_CACHE_HIT=1" >> "$GITHUB_ENV"
          fi

      - name: Build and copy excluded memory benchmark binary to workspace target
        if: ${{ contains(matrix.crate, 'miden') || contains(matrix.crate, 'cairo-m') || contains(matrix.crate, 'rookie-numbers') }}
        run: |
          mkdir -p target/release
          if [ "${{ matrix.crate }}" = "miden" ]; then
            cd miden && cargo build --release --bin sha256_mem_miden --bin blake3_mem_miden --bin ecdsa_mem_miden && cd ..
            cp miden/target/release/sha256_mem_miden miden/target/release/blake3_mem_miden miden/target/release/ecdsa_mem_miden target/release/
          elif [ "${{ matrix.crate }}" = "cairo-m" ]; then
            cd cairo-m && ../.github/actions/install-llvm/with-llvm.sh cargo build --release --bin sha256_mem_cairo_m && cd ..
            cp cairo-m/target/release/sha256_mem_cairo_m target/release/
          elif [ "${{ matrix.crate }}" = "rookie-numbers" ]; then
            cd rookie-numbers && cargo build --release --bin sha256_mem_rookie_numbers && cd ..
            cp rookie-numbers/target/release/sha256_mem_rookie_numbers target/release/
          fi

      - name: Validate Spartan-WHIR circuit integration
        if: ${{ matrix.crate == 'spartan-whir' }}
        env:
          BENCH_INPUT_PROFILE: reduced
        run: cargo test --release -p spartan-whir-bench --lib -- --include-ignored --test-threads=1

      - name: Run benches in ${{ matrix.crate }}
        run: |
          PROFILE="full"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PROFILE="reduced"
          fi
          BENCHMARK_TARGET='${{ github.event.inputs.benchmark_target }}'
          export BENCH_INPUT_PROFILE="$PROFILE"
          if [[ "${{ matrix.crate }}" == "jolt" ]]; then
            export RUST_MIN_STACK=134217728
          fi
          echo "Using BENCH_INPUT_PROFILE=$BENCH_INPUT_PROFILE for ${{ matrix.crate }}"
          cd ${{ matrix.crate }}
          cargo_command=(cargo)
          if [[ "${{ matrix.crate }}" == "cairo-m" ]]; then
            cargo_command=(../.github/actions/install-llvm/with-llvm.sh cargo)
          fi
          if [[ -n "$BENCHMARK_TARGET" ]]; then
            echo "Running targeted bench command: cargo bench --bench $BENCHMARK_TARGET"
            "${cargo_command[@]}" bench --bench "$BENCHMARK_TARGET"
          else
            echo "Running bench command: cargo bench"
            "${cargo_command[@]}" bench
          fi

      - name: Copy excluded crates criterion results to workspace target
        if: ${{ contains(matrix.crate, 'miden') || contains(matrix.crate, 'cairo-m') || contains(matrix.crate, 'rookie-numbers') }}
        run: |
          mkdir -p target/criterion
          cp -r ${{ matrix.crate }}/target/criterion/* target/criterion/

      - name: Upload reports for ${{ matrix.crate }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "criterion-${{ matrix.crate }}"
          path: target/criterion
          if-no-files-found: warn
          retention-days: 30

      - name: Upload metrics for ${{ matrix.crate }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "metrics-${{ matrix.crate }}"
          path: ${{ matrix.crate }}/**/*_metrics.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload mem reports for ${{ matrix.crate }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "mem-${{ matrix.crate }}"
          path: |
            ${{ matrix.crate }}/*_mem_report.json
          if-no-files-found: warn
          retention-days: 30
