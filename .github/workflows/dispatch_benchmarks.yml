name: Dispatch All Benchmarks (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref name to run on (branch or tag)"
        required: false
      run_all:
        description: "Force running all benches regardless of changes"
        required: false
        default: true
        type: boolean
      benchmark_crate:
        description: "Run only this benchmark crate in Rust workflow (e.g. risc0)"
        required: false
        default: ""
        type: string
      benchmark_target:
        description: "Run only this bench target in benchmark_crate (e.g. sha256)"
        required: false
        default: ""
        type: string
      run_non_rust:
        description: "Also dispatch Non-Rust Benchmarks workflow"
        required: false
        default: true
        type: boolean
      prod-run:
        description: "Run children on self-hosted runner"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ${{ inputs['prod-run'] && 'self-hosted' || 'macos-latest' }}
    steps:
      - name: Install gh
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: brew install gh

      - name: Determine ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          REF_INPUT="${{ github.event.inputs.ref }}"
          if [[ -n "$REF_INPUT" ]]; then
            echo "ref=$REF_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate targeted benchmark inputs
        shell: bash
        run: |
          set -euo pipefail
          BENCHMARK_CRATE='${{ github.event.inputs.benchmark_crate }}'
          BENCHMARK_TARGET='${{ github.event.inputs.benchmark_target }}'

          if [[ -n "$BENCHMARK_TARGET" && -z "$BENCHMARK_CRATE" ]]; then
            echo "benchmark_target requires benchmark_crate" >&2
            exit 1
          fi

      - name: Dispatch Rust Benchmarks (parallel)
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_RUN: ${{ github.event.inputs['prod-run'] }}
          BENCHMARK_CRATE: ${{ github.event.inputs.benchmark_crate }}
          BENCHMARK_TARGET: ${{ github.event.inputs.benchmark_target }}
        shell: bash
        run: |
          set -euo pipefail
          REF='${{ steps.ref.outputs.ref }}'
          RUN_ALL='${{ github.event.inputs.run_all }}'
          gh workflow run -R "$GITHUB_REPOSITORY" "Rust Benchmarks (parallel)" \
            --ref "$REF" \
            -f run_all="$RUN_ALL" \
            -f benchmark_crate="$BENCHMARK_CRATE" \
            -f benchmark_target="$BENCHMARK_TARGET" \
            -f prod_run="$PROD_RUN"

      - name: Dispatch Non-Rust Benchmarks (parallel)
        if: ${{ github.event.inputs.run_non_rust == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_RUN: ${{ github.event.inputs['prod-run'] }}
        shell: bash
        run: |
          set -euo pipefail
          REF='${{ steps.ref.outputs.ref }}'
          RUN_ALL='${{ github.event.inputs.run_all }}'
          gh workflow run -R "$GITHUB_REPOSITORY" "Non-Rust Benchmarks (parallel)" \
            --ref "$REF" \
            -f run_all="$RUN_ALL" \
            -f prod_run="$PROD_RUN"
