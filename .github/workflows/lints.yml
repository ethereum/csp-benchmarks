name: Lints

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  EXCLUDED_CRATES: "binius64 cairo-m stark-v"
  GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}

# ────────────────── 1. Warm‑up build ──────────────────
jobs:
  fmt:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache everything
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup
            target
            binius64/target
            cairo-m/target
            rookie-numbers/target
            stark-v/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-03-04
          override: true
          profile: default
          default: true
          components: rustfmt, clippy

      - name: Install Binius toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.97.1
          profile: minimal
          components: rustfmt, clippy

      - name: Install excluded crates toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-04-06
          profile: minimal
          components: llvm-tools, rustc-dev, rust-src, rustfmt, clippy

      - name: Install OpenMPI
        uses: ./.github/actions/install-ompi

      - name: Install LLVM and LLD for cairo-m
        uses: ./.github/actions/install-llvm

      - name: Install protobuf
        uses: ./.github/actions/install-protobuf

      - name: Install circom
        id: circom_setup
        uses: ./.github/actions/install-circom

      - name: Cache the ECDSA witness generator
        id: ecdsa_witness_cache
        uses: actions/cache@v4
        with:
          # Only the generated files: the same directories also hold the
          # downloaded .zkey, which must not be cached or restored over.
          path: |
            circom/circuits/ecdsa/ecdsa_32/ecdsa_32.cpp
            circom/circuits/ecdsa/ecdsa_32/ecdsa_32.dat
            circom/circuits/ecdsa/ecdsa_p256_32/ecdsa_p256_32.cpp
            circom/circuits/ecdsa/ecdsa_p256_32/ecdsa_p256_32.dat
          key: ${{ runner.os }}-${{ runner.arch }}-ecdsa-witness-circom-${{ steps.circom_setup.outputs.version }}-${{ hashFiles('circom/build.rs', 'circom/circuits/ecdsa/**/*.circom', 'circom/circomlib/circuits/**/*.circom') }}

      # Preserve the restored mtimes used by the native build cache. The exact
      # key above establishes that both files match every generator input.
      - name: Use cached ECDSA witness generator
        if: ${{ steps.ecdsa_witness_cache.outputs.cache-hit == 'true' }}
        run: |
          if test -s circom/circuits/ecdsa/ecdsa_32/ecdsa_32.cpp && test -s circom/circuits/ecdsa/ecdsa_32/ecdsa_32.dat; then
            echo "CIRCOM_ECDSA_WITNESS_CACHE_HIT=1" >> "$GITHUB_ENV"
          fi

      - name: Build full workspace
        run: cargo build --workspace

      - name: Build excluded crates
        run: |
          for crate in $EXCLUDED_CRATES; do
            cd "$crate" && cargo build && cd ..
          done

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check generated Miden BLAKE3 programs
        run: python3 miden/guest/blake3/generate_programs.py --check

      - name: Format excluded crates
        run: |
          for crate in $EXCLUDED_CRATES; do
            cd "$crate" && cargo fmt --all -- --check && cd ..
          done

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Clippy excluded crates
        run: |
          for crate in $EXCLUDED_CRATES; do
            cd "$crate" && cargo clippy --all-targets --all-features && cd ..
          done
