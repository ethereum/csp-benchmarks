name: Non-Rust Benchmarks (parallel)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run benches for all non-Rust systems"
        required: false
        default: false
        type: boolean
      prod_run:
        description: "Run on self-hosted runner"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  detect-folders:
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.prod_run == true) && 'self-hosted' || 'macos-latest' }}
    outputs:
      folders: ${{ steps.set.outputs.folders }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base‑remote and fetch it
        id: base
        run: |
          REMOTE=origin
          if [[ "${GITHUB_REPOSITORY}" != "privacy-ethereum/csp-benchmarks" ]]; then
            git remote add upstream https://github.com/privacy-ethereum/csp-benchmarks.git
            REMOTE=upstream
          fi

          BASE_BRANCH="main"
          git fetch --prune --no-tags --depth=1 "$REMOTE" "$BASE_BRANCH"

          # expose for later steps
          echo "BASE_REF=${REMOTE}/${BASE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Detect changed top-level folders
        id: set
        run: |
          BASE_REF="${{ steps.base.outputs.BASE_REF }}"

          RUN_ALL="${{ github.event.inputs.run_all }}"
          # ─── Run all benches when we're merging a PR ─────────────────────
          EVENT_NAME='${{ github.event_name }}'
          if [[ "$EVENT_NAME" == "push" ]]; then
            RUN_ALL="true"
          fi

          # ─── 1. list of top‑level folders to watch ────────────
          FOLDERS=(
            ligetron
            barretenberg
          )

          # ─── 2. filter by diff (or include all when run_all=true) ───────
          changed=()
          for d in "${FOLDERS[@]}"; do

            if [[ "$RUN_ALL" == "true" ]]; then
              changed+=("$d")
              continue
            fi

            if git diff --name-only "$BASE_REF"..HEAD 2>/dev/null | grep -qE "^${d}(/|$)"; then
              changed+=("$d")
            fi
          done

          # ─── 3. output JSON array ───────────────────────────────────────
          json=$(printf '%s\n' "${changed[@]}" | jq -R -s -c 'split("\n") | map(select(length>0))')

          echo "Detected changed folders: '$json'"
          echo "folders=$json" >> "$GITHUB_OUTPUT"

  run-benchmarks:
    if: ${{ needs.detect-folders.outputs.folders != '' && needs.detect-folders.outputs.folders != '[]' }}
    needs: [detect-folders]
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.prod_run == true) && 'self-hosted' || 'macos-latest' }}
    strategy:
      fail-fast: false
      # When dispatched with prod_run=true (self-hosted), run matrix sequentially
      max-parallel: ${{ (github.event_name == 'workflow_dispatch' && inputs.prod_run == true) && 1 || 99 }}
      matrix:
        folder: ${{ fromJson(needs.detect-folders.outputs.folders) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Update bash under macOS for mapfile
        run: |
          brew install bash

      - name: Install pinned WABT (only when folder is ligetron)
        if: ${{ matrix.folder == 'ligetron' }}
        uses: ./.github/actions/install-wabt

      - name: Setup & build Ligetron (only when folder is ligetron)
        if: ${{ matrix.folder == 'ligetron' }}
        uses: ./.github/actions/install-ligero
        with:
          ligero_path: ./ligetron/ligero-prover
          install_prefix: ${{ github.workspace }}/.deps/install

      - name: Build Ligetron benchmark programs
        if: ${{ matrix.folder == 'ligetron' }}
        run: bash ./ligetron/build_programs.sh

      - name: Setup Nargo (only when folder is barretenberg)
        if: ${{ matrix.folder == 'barretenberg' }}
        uses: ./.github/actions/install-nargo

      - name: Setup Barretenberg (only when folder is barretenberg)
        if: ${{ matrix.folder == 'barretenberg' }}
        uses: ./.github/actions/install-bb

      - name: Ensure jq present
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            brew update >/dev/null
            brew install jq
          fi

      - name: Install hyperfine
        run: |
          set -euo pipefail
          VERSION="$(cat .hyperfine-version)"
          ASSET="hyperfine-v${VERSION}-aarch64-apple-darwin"
          INSTALL_DIR="$RUNNER_TEMP/hyperfine-$VERSION/bin"
          mkdir -p "$INSTALL_DIR"
          curl -fsSL "https://github.com/sharkdp/hyperfine/releases/download/v${VERSION}/${ASSET}.tar.gz" \
            | tar -xz --strip-components=1 -C "$INSTALL_DIR" "$ASSET/hyperfine"
          test "$("$INSTALL_DIR/hyperfine" --version)" = "hyperfine $VERSION"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Install Rust toolchain (stable)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Build utils
        run: cargo build --release -p utils

      - name: Run benches in ${{ matrix.folder }}
        run: |
          set -euo pipefail
          PROFILE="full"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PROFILE="reduced"
          fi
          export BENCH_INPUT_PROFILE="$PROFILE"
          echo "Using BENCH_INPUT_PROFILE=$BENCH_INPUT_PROFILE for ${{ matrix.folder }}"
          if [[ -f ./benchmark.sh ]]; then
            bash ./benchmark.sh --system-dir "./${{ matrix.folder }}" --logging
          else
            echo "benchmark.sh not found in repository root" >&2
            exit 1
          fi

      - name: Upload outputs for ${{ matrix.folder }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "benchmark-outputs-${{ matrix.folder }}"
          path: |
            ${{ matrix.folder }}/*_metrics.json
          if-no-files-found: warn
          retention-days: 30
