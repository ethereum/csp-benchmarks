name: Ligero setup & build (macOS)
description: Install deps (Dawn, emsdk), then build ligero-prover SDK+native.

inputs:
  ligero_path:
    description: Path to the ligero-prover root (relative to workspace).
    required: false
    default: .
  dawn_commit:
    description: Dawn commit to build.
    required: false
    default: cec4482eccee45696a7c0019e750c77f101ced04
  install_prefix:
    description: Where to install Dawn (used as CMAKE_PREFIX_PATH).
    required: false
    default: ${{ github.workspace }}/.deps/install

outputs:
  build_dir:
    description: Path to native build dir
    value: ${{ steps.paths.outputs.build_dir }}
  sdk_build_dir:
    description: Path to SDK build dir (sdk/cpp/build)
    value: ${{ steps.paths.outputs.sdk_build_dir }}
  install_prefix:
    description: Install prefix used for dependencies
    value: ${{ inputs.install_prefix }}

runs:
  using: "composite"
  steps:
    - name: Resolve paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        LIGERO="${{ inputs.ligero_path }}"
        echo "build_dir=${LIGERO}/build" >> "$GITHUB_OUTPUT"
        echo "sdk_build_dir=${LIGERO}/sdk/cpp/build" >> "$GITHUB_OUTPUT"

    - name: Brew deps (conditionally)
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
      run: |
        set -euo pipefail
        NEEDS=()
        for pkg in cmake ninja gmp mpfr libomp llvm boost nlohmann-json protobuf ccache; do
          brew list --versions "$pkg" >/dev/null 2>&1 || NEEDS+=("$pkg")
        done
        if [[ ${#NEEDS[@]} -gt 0 ]]; then
          brew update
          brew install "${NEEDS[@]}"
        else
          echo "All brew deps present; skipping brew update/install."
        fi

    - name: Prepare dirs
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .deps/src .deps/build "${{ inputs.install_prefix }}" third_party

    # ---------- ccache (enable early for all builds) ----------
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          ~/Library/Caches/ccache
        key: ccache-macos-v1

    - name: Enable ccache
      shell: bash
      run: |
        echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
        echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
        echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV
        ccache -s || true

    # Cache Dawn install folder keyed by Dawn commit.
    - name: Cache deps install
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: ${{ inputs.install_prefix }}
        key: deps-macos-dawn-${{ inputs.dawn_commit }}-v1

    # ---------- Dawn ----------
    - name: Build & install Dawn
      if: steps.cache-deps.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd third_party
        if [ ! -d dawn ]; then
          git clone https://dawn.googlesource.com/dawn
        fi
        cd dawn
        git fetch --all
        git checkout "${{ inputs.dawn_commit }}"
        mkdir -p release && cd release
        cmake -G Ninja \
              -DDAWN_FETCH_DEPENDENCIES=ON \
              -DDAWN_BUILD_MONOLITHIC_LIBRARY=STATIC \
              -DDAWN_ENABLE_INSTALL=ON \
              -DDAWN_BUILD_TESTS=OFF \
              -DDAWN_BUILD_SAMPLES=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_INSTALL_PREFIX="${{ inputs.install_prefix }}" ..
        cmake --build . --parallel
        cmake --install .

    # ---------- Emscripten ----------
    - name: Setup Emscripten cache for system libraries
      id: cache-emsdk-syslibs
      uses: actions/cache@v4
      with:
        path: emsdk-cache
        key: emsdk-syslibs-latest-${{ runner.os }}

    - name: Setup Emscripten (emsdk)
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest
        update: true
        actions-cache-folder: emsdk-cache

    - name: Verify emcc
      shell: bash
      run: emcc -v

    # ---------- Build SDK (emscripten) ----------
    - name: Cache SDK build
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: ${{ inputs.ligero_path }}/sdk/cpp/build
        key: sdk-build-${{ runner.os }}-${{ hashFiles(format('{0}/sdk/cpp/CMakeLists.txt', inputs.ligero_path)) }}-${{ hashFiles(format('{0}/sdk/cpp/src/**', inputs.ligero_path)) }}

    - name: Reset SDK CMake cache (avoid stale EMSDK toolchain paths)
      shell: bash
      run: |
        set -euo pipefail
        rm -f "${{ inputs.ligero_path }}/sdk/cpp/build/CMakeCache.txt"
        rm -rf "${{ inputs.ligero_path }}/sdk/cpp/build/CMakeFiles"

    - name: Build SDK (emscripten)
      shell: bash
      run: |
        set -euo pipefail
        emcmake cmake -S "${{ inputs.ligero_path }}/sdk/cpp" -B "${{ inputs.ligero_path }}/sdk/cpp/build" -G Ninja
        cmake --build "${{ inputs.ligero_path }}/sdk/cpp/build" --parallel

    # ---------- Build native ----------
    - name: Cache native build
      id: cache-native
      uses: actions/cache@v4
      with:
        path: ${{ inputs.ligero_path }}/build
        key: "native-build-${{ runner.os }}-${{ github.workspace }}-Release-${{ hashFiles(format('{0}/CMakeLists.txt', inputs.ligero_path)) }}-${{ hashFiles(format('{0}/src/**', inputs.ligero_path)) }}"

    - name: Fix CMake cache if source path differs
      shell: bash
      run: |
        set -euo pipefail
        want="$(cd "${{ inputs.ligero_path }}" && pwd)"
        while IFS= read -r -d '' cache; do
          have="$(awk -F= '/^CMAKE_HOME_DIRECTORY:/{print $2; exit}' "$cache" || true)"
          if [[ -n "$have" && "$have" != "$want" ]]; then
            echo "CMakeCache mismatch: $cache (have=$have, want=$want) -> removing"
            rm -f "$cache"
            dir="$(dirname "$cache")"
            rm -rf "$dir/CMakeFiles" || true
          fi
        done < <(find "${{ inputs.ligero_path }}/build" -name CMakeCache.txt -print0)
    - name: Configure & build native
      shell: bash
      run: |
        set -euo pipefail
        cmake -S "${{ inputs.ligero_path }}" -B "${{ inputs.ligero_path }}/build" \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_NO_SYSTEM_FROM_IMPORTED=ON \
              -DCMAKE_PREFIX_PATH="${{ inputs.install_prefix }}"
        cmake --build "${{ inputs.ligero_path }}/build" --parallel

    - name: ccache stats
      shell: bash
      run: ccache -s || true
