[package]
name = "provekit-groth16-bench"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"

[dependencies]
rand = "0.8"
utils = { path = "../utils" }
criterion = "0.5"
clap = { version = "4.5", features = ["derive", "env"] }
ark-serialize = "0.5"
noirc_abi = { git = "https://github.com/noir-lang/noir", rev = "v1.0.0-beta.19" }
provekit-common = { git = "https://github.com/worldfnd/ProveKit", rev = "b910fe8da2b909bb84f0c48a5078101369bfb435" }
provekit-r1cs-compiler = { git = "https://github.com/worldfnd/ProveKit", rev = "b910fe8da2b909bb84f0c48a5078101369bfb435" }
provekit-prover = { git = "https://github.com/worldfnd/ProveKit", rev = "b910fe8da2b909bb84f0c48a5078101369bfb435" }
provekit-verifier = { git = "https://github.com/worldfnd/ProveKit", rev = "b910fe8da2b909bb84f0c48a5078101369bfb435" }
provekit-groth16 = { git = "https://github.com/worldfnd/ProveKit", rev = "b910fe8da2b909bb84f0c48a5078101369bfb435" }

[[bin]]
name = "sha256_mem_provekit_groth16"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "ecdsa_mem_provekit_groth16"
path = "src/bin/ecdsa_mem.rs"

[[bin]]
name = "poseidon_mem_provekit_groth16"
path = "src/bin/poseidon_mem.rs"

[[bin]]
name = "keccak_mem_provekit_groth16"
path = "src/bin/keccak_mem.rs"

[[bin]]
name = "poseidon2_mem_provekit_groth16"
path = "src/bin/poseidon2_mem.rs"

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "ecdsa"
harness = false

[[bench]]
name = "poseidon"
harness = false

[[bench]]
name = "poseidon2"
harness = false

[[bench]]
name = "keccak"
harness = false

[patch.crates-io]
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
allocative = { git = "https://github.com/facebookexperimental/allocative", rev = "85b773d85d526d068ce94724ff7a7b81203fc95e" }
