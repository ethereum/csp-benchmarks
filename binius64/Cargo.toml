[package]
name = "binius64"
version = "0.1.0"
edition = "2024"

[lib]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.10.1"
tracing = "0.1"
criterion = "0.5"
utils = { path = "../utils" }
sha2 = "0.10"
sha3 = "0.12.0"
blake3 = "1.8"

tracing-profile = "0.10"
# TODO: Return to IrreducibleOSS/binius64 as soon as the upstream BLAKE3 dependency/feature conflict with ProveKit is resolved.
binius-frontend = { git = "https://github.com/Client-Side-Proving/binius64", rev = "1bdf6a9206b0ece76b721cad72ab188a406e4b93" }
binius-circuits = { git = "https://github.com/Client-Side-Proving/binius64", rev = "1bdf6a9206b0ece76b721cad72ab188a406e4b93" }
binius-prover = { git = "https://github.com/Client-Side-Proving/binius64", rev = "1bdf6a9206b0ece76b721cad72ab188a406e4b93" }
binius-verifier = { git = "https://github.com/Client-Side-Proving/binius64", rev = "1bdf6a9206b0ece76b721cad72ab188a406e4b93" }
binius-core = { git = "https://github.com/Client-Side-Proving/binius64", rev = "1bdf6a9206b0ece76b721cad72ab188a406e4b93" }
binius-utils = { git = "https://github.com/Client-Side-Proving/binius64", rev = "1bdf6a9206b0ece76b721cad72ab188a406e4b93" }
binius-hash = { git = "https://github.com/Client-Side-Proving/binius64", rev = "1bdf6a9206b0ece76b721cad72ab188a406e4b93" }
binius-transcript = { git = "https://github.com/Client-Side-Proving/binius64", rev = "1bdf6a9206b0ece76b721cad72ab188a406e4b93" }

[[bench]]
name = "sha256_bench"
harness = false

[[bench]]
name = "keccak_bench"
harness = false

[[bench]]
name = "blake3_bench"
harness = false

[[bin]]
name = "sha256_mem_binius64"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "keccak_mem_binius64"
path = "src/bin/keccak_mem.rs"

[[bin]]
name = "blake3_mem_binius64"
path = "src/bin/blake3_mem.rs"
