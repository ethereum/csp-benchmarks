[package]
name = "binius64"
version = "0.1.0"
edition = "2024"

[lib]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.10.1"
tracing = "0.1"
criterion = "0.5"
utils = { path = "../utils" }
sha2 = "0.10"
sha3 = "0.12.0"
blake3 = "1.8"

tracing-profile = "0.10"
binius-frontend = { git = "https://github.com/IrreducibleOSS/binius64", rev = "3bab18d86086b21682f12bb561a20b4a5e1b03b5" }
binius-circuits = { git = "https://github.com/IrreducibleOSS/binius64", rev = "3bab18d86086b21682f12bb561a20b4a5e1b03b5" }
binius-prover = { git = "https://github.com/IrreducibleOSS/binius64", rev = "3bab18d86086b21682f12bb561a20b4a5e1b03b5" }
binius-verifier = { git = "https://github.com/IrreducibleOSS/binius64", rev = "3bab18d86086b21682f12bb561a20b4a5e1b03b5" }
binius-core = { git = "https://github.com/IrreducibleOSS/binius64", rev = "3bab18d86086b21682f12bb561a20b4a5e1b03b5" }
binius-utils = { git = "https://github.com/IrreducibleOSS/binius64", rev = "3bab18d86086b21682f12bb561a20b4a5e1b03b5" }
binius-hash = { git = "https://github.com/IrreducibleOSS/binius64", rev = "3bab18d86086b21682f12bb561a20b4a5e1b03b5" }
binius-transcript = { git = "https://github.com/IrreducibleOSS/binius64", rev = "3bab18d86086b21682f12bb561a20b4a5e1b03b5" }

[profile.release]
lto = "thin"
debug = true

[profile.bench]
inherits = "release"
debug = true

[[bench]]
name = "sha256_bench"
harness = false

[[bench]]
name = "keccak_bench"
harness = false

[[bench]]
name = "blake3_bench"
harness = false

[[bin]]
name = "sha256_mem_binius64"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "keccak_mem_binius64"
path = "src/bin/keccak_mem.rs"

[[bin]]
name = "blake3_mem_binius64"
path = "src/bin/blake3_mem.rs"
