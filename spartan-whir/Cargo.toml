[package]
name = "spartan-whir-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
bincode = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
num-bigint = "0.4"
num-traits = "0.2"
p3-field = { git = "https://github.com/Client-Side-Proving/Plonky3.git", rev = "458ef546a251ab4d9d73c453d24a414334786ca0" }
p3-koala-bear = { git = "https://github.com/Client-Side-Proving/Plonky3.git", rev = "458ef546a251ab4d9d73c453d24a414334786ca0" }
p3-symmetric = { git = "https://github.com/Client-Side-Proving/Plonky3.git", rev = "458ef546a251ab4d9d73c453d24a414334786ca0" }
sha2 = { workspace = true }
sha3 = { workspace = true }
spartan-whir = { git = "https://github.com/ethereum/spartan-whir", rev = "14d6da4211eda59e65cfd0af5e2dcd89d523edc3", features = ["parallel"] }
tempfile = "3"
utils = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "sha256_bench"
harness = false

[[bench]]
name = "keccak_bench"
harness = false

[[bench]]
name = "poseidon_bench"
harness = false

[[bench]]
name = "ecdsa_bench"
harness = false

[[bench]]
name = "ecdsa_p256_bench"
harness = false

[[bin]]
name = "sha256_mem_spartan_whir"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "keccak_mem_spartan_whir"
path = "src/bin/keccak_mem.rs"

[[bin]]
name = "poseidon_mem_spartan_whir"
path = "src/bin/poseidon_mem.rs"

[[bin]]
name = "ecdsa_mem_spartan_whir"
path = "src/bin/ecdsa_mem.rs"

[[bin]]
name = "ecdsa_p256_mem_spartan_whir"
path = "src/bin/ecdsa_p256_mem.rs"
