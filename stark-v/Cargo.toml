[package]
name = "stark-v"
version = "0.1.0"
edition = "2021"

[dependencies]
stark-v-sdk = { git = "https://github.com/ClementWalter/stark-v", rev = "d478f783055aa0d73a93768a433a3c6c31c91d1c" }
ere-zkvm-interface = { git = "https://github.com/Client-Side-Proving/ere", rev = "c9527535fb7976aee30727c3d3bd87a792c423d1" }
bincode = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
utils = { path = "../utils" }

[dev-dependencies]
criterion = "0.5"

# The SDK implements the shared interface from the pinned CSP fork.
[patch."https://github.com/eth-act/ere"]
ere-zkvm-interface = { git = "https://github.com/Client-Side-Proving/ere", rev = "c9527535fb7976aee30727c3d3bd87a792c423d1" }

[features]
default = ["parallel"]
parallel = ["stark-v-sdk/parallel"]

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "keccak"
harness = false

[[bench]]
name = "blake3"
harness = false

[[bin]]
name = "sha256_mem_stark_v"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "keccak_mem_stark_v"
path = "src/bin/keccak_mem.rs"

[[bin]]
name = "blake3_mem_stark_v"
path = "src/bin/blake3_mem.rs"
