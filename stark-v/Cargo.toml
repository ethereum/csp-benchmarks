[package]
name = "stark-v"
version = "0.1.0"
edition = "2021"

[dependencies]
stark-v-sdk = { git = "https://github.com/ClementWalter/stark-v", rev = "d478f783055aa0d73a93768a433a3c6c31c91d1c" }
ere-zkvm-interface = { workspace = true }
bincode = { workspace = true }
clap = { workspace = true }
utils = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[features]
default = ["parallel"]
parallel = ["stark-v-sdk/parallel"]

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "keccak"
harness = false

[[bench]]
name = "blake3"
harness = false

[[bin]]
name = "sha256_mem_stark_v"
path = "src/bin/sha256_mem.rs"

[[bin]]
name = "keccak_mem_stark_v"
path = "src/bin/keccak_mem.rs"

[[bin]]
name = "blake3_mem_stark_v"
path = "src/bin/blake3_mem.rs"
